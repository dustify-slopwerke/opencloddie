# Local quick-start compose stack.
#
#   docker compose up -d --build
#
# Both ports bind to loopback.  For the public API, put nginx (and Authelia for
# the web UI) in front and use deploy/README.md.  Never publish :8787.
services:
  opencloddie:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: opencloddie:local
    # Or use a published image instead of building:
    # image: ghcr.io/OWNER/opencloddie:latest
    restart: unless-stopped
    environment:
      - TZ=UTC
      - OPENCLODDIE_CONFIG=/data/config.json
      - OPENCLODDIE_STATE_DIR=/data
    ports:
      - "127.0.0.1:8787:8787"   # internal web UI
      - "127.0.0.1:8788:8788"   # API; expose through nginx + TLS in production
    volumes:
      - opencloddie-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  opencloddie-data:
