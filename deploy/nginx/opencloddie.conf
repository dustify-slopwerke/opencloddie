# opencloddie nginx server block for the existing ~/compose/edge nginx.
#
# Copy this file to ~/compose/edge/assets/nginx/config/opencloddie.conf and
# reload nginx.  It assumes the shared snippets already in ~/compose/edge:
#
#   /snippets/ssl_params.conf        TLS certificate
#   /snippets/authelia.conf          internal auth_request endpoint
#   /snippets/authelia_location.conf inject Remote-User/Groups/Email/Name
#   /snippets/proxy_params.conf      Host, X-Forwarded-*, Upgrade, buffering
#
# Replace cloddie.example.com with your hostname, and add the matching rule to
# Authelia's access_control (see deploy/README.md).
#
# Trust boundary:
#   /v1/, /agent/, /client/, /install/  -> API listener, public, API-key auth
#   everything else                     -> web listener, Authelia only
# The web listener must never be published directly.

server {
    server_name cloddie.example.com;

    include /snippets/ssl_params.conf;
    include /snippets/authelia.conf;

    # Claude Code -> Anthropic-compatible gateway.  Long timeouts for SSE;
    # no response buffering.
    location /v1/ {
        set $opencloddie_api opencloddie:8788;
        proxy_pass http://$opencloddie_api;
        include /snippets/proxy_params.conf;

        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Agent WebSocket: opencloddie clients ship tmux terminal channels here.
    location /agent/ {
        set $opencloddie_api opencloddie:8788;
        proxy_pass http://$opencloddie_api;
        include /snippets/proxy_params.conf;

        proxy_set_header Remote-User "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # CLI session list/delete and the client installer.
    location /client/ {
        set $opencloddie_api opencloddie:8788;
        proxy_pass http://$opencloddie_api;
        include /snippets/proxy_params.conf;

        proxy_set_header Remote-User "";
        proxy_read_timeout 60s;
    }

    location /install {
        set $opencloddie_api opencloddie:8788;
        proxy_pass http://$opencloddie_api;
        include /snippets/proxy_params.conf;

        proxy_set_header Remote-User "";
        proxy_read_timeout 60s;
    }

    # Web UI, management API, and browser terminal WebSockets.  This is the
    # only location that invokes Authelia.
    location / {
        set $opencloddie_web opencloddie:8787;
        proxy_pass http://$opencloddie_web;
        include /snippets/proxy_params.conf;
        include /snippets/authelia_location.conf;

        # Optional defence in depth: set the same value in config.json under
        # web.proxy_secret.  Leave both empty to rely on the internal network.
        # proxy_set_header X-OpenCloddie-Proxy-Secret "replace-me";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
