name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import opencloddie
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{opencloddie.__version__}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match {expected!r}")
          print(f"releasing {tag}")
          PY

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build wheel, sdist, and client
        run: |
          python -m pip install --upgrade build
          python -m build
          cp -L bin/opencloddie dist/opencloddie
          chmod +x dist/opencloddie

      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          opencloddie-server --version

      - name: Compute image name and version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=opencloddie
            org.opencontainers.image.description=Anthropic-compatible gateway and terminal relay for Claude Code
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            SOURCE_URL=https://github.com/${{ github.repository }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/opencloddie
