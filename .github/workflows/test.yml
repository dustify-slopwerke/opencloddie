name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Compile
        run: python3 -m py_compile opencloddie/*.py opencloddie/client/opencloddie bin/opencloddie-server

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          opencloddie-server --version

      - name: Build container
        run: docker build -f deploy/Dockerfile -t opencloddie:test .
