name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste API keys, OpenCode keys, session cookies, or terminal output containing secrets.** Redact them first.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Server log, agent log, browser console, or terminal output. Redact secrets.

  - type: input
    id: version
    attributes:
      label: opencloddie version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker image / compose
        - Source checkout
        - Python wheel
        - Local development
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/architecture, Python version, Claude Code version, tmux version, browser.
      placeholder: "Linux arm64, Python 3.12, Claude Code 2.1.319, tmux 3.4, Chrome 157"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and private data from logs and screenshots.
          required: true
        - label: I searched existing issues.
          required: true
